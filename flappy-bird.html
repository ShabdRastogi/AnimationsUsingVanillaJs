<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      background-color: #111;
    }
    #board{
      border: 2px solid;
      background-image: url('./image/flappybg.jpg');
      background-size: cover;
    }
    button{
      display: block;
      margin: 20px auto 20px;
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#fff;
      color:#111;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#ddd;
    }
  </style>
  <title>Document</title>
</head>
<body>
  <button onclick="window.location.href='./index.html'">Back to Games</button>
  <canvas id="board"></canvas>

  <script>
    //board
    let boardHeight = 613;
    let boardWidth = 318;
    let context;

    //bird
    let birdWidth = 40;
    let birdHeight = 20;
    let birdX = boardWidth/8;
    let birdY = boardHeight/2;
    let birdImg;

    let bird = {
      x:birdX,
      y:birdY,
      width:birdWidth,
      height:birdHeight
    }

    //pipes
    let pipeArray = [];
    let pipeWidth = 64;
    let pipeHeight = 512;
    let pipeX = boardWidth ;
    let pipeY = 0;
    let topPipeImg;
    let bottomPipeImg;
    
    //physics
    let velocityX =-1;
    let velocityY = 0;
    let gravity = 0.2;
    let gameOver = false;
    let score = 0;

    window.onload = function(){
      const board = document.getElementById('board')
      board.width = boardWidth;
      board.height = boardHeight;

      context = board.getContext('2d')

      //drawing the elements

      
      //load image
      //bird image
      birdImg = new Image();
      birdImg.src = './image/bird.png'
      birdImg.onload = function(){
        context.drawImage(birdImg,bird.x,bird.y,bird.width,bird.height);
      }

      //pipe image
      topPipeImg = new Image();
      topPipeImg.src = './image/toppipe.png'
      bottomPipeImg = new Image();
      bottomPipeImg.src = './image/bottompipe.png'

      requestAnimationFrame(update);
      setInterval(placePipes,1500)

      document.addEventListener('keydown',moveBird);
      document.addEventListener('touchstart', moveBird);
    }

    function update(){
      requestAnimationFrame(update);
      if(gameOver){
        return;
      }
      context.clearRect(0,0,boardWidth,boardHeight);

      context.drawImage(birdImg,bird.x,bird.y,bird.width,bird.height)
      velocityY += gravity;
      bird.y += velocityY;

      if(bird.y < 0){
        bird.y = 0;
      }
      
      if(bird.y >board.height){
        gameOver =true;
      }

      //pipes 
      for(let i=0;i<pipeArray.length;i++){
        let pipe = pipeArray[i];
        pipe.x+=velocityX;
        context.drawImage(pipe.img,pipe.x,pipe.y,pipe.width,pipe.height)
        if(!pipe.passed && bird.x >pipe.x+pipe.width){
          score+=0.5;
          pipe.passed = true;
        }
        if(detectCollision(bird,pipe)){
          gameOver = true;
        }
      }
      while(pipeArray.length >0 && pipeArray[0].x< -pipeWidth){
        pipeArray.shift();
      }
      //text
      context.fillStyle = 'white';
      context.font = '30px Arial';
      context.fillText(score,10,40)

      if(gameOver){
        context.fillText('GAME OVER!',60,boardHeight/2)
        context.fillText(`Score : ${score}`,100,boardHeight/2+50)
      }
    }


    function placePipes(){
      if(gameOver){
        return;
      }
      let randomPipeY = pipeY- pipeHeight/4 - Math.random() * (pipeHeight/2);
      let openingSpace = board.height/2.5;
      let topPipe = { 
        img : topPipeImg,
        x:pipeX,
        y:randomPipeY,
        width:pipeWidth,
        height:pipeHeight,
        passed:false
      }
      pipeArray.push(topPipe)
      let bottomPipe = {
        img : bottomPipeImg,
        x:pipeX,
        y:randomPipeY + pipeHeight + openingSpace,
        width:pipeWidth,
        height:pipeHeight,
        passed:false
      }
      pipeArray.push(bottomPipe)
    }

    function moveBird(e){
      if(e.code == 'Space' || event.code == 'ArrowUp' || event.type == 'touchstart'){
        velocityY = -6;
      }

      if(gameOver){
        bird.y = birdY;
        pipeArray = [];
        score = 0;
        gameOver = false;
      }
    }

    function detectCollision(a,b){
      return a.x < b.x + b.width &&
      a.x+a.width > b.x &&
      a.y < b.y +b.height &&
      a.y+a.height > b.y;
    }
    
  </script>
</body>
</html>
