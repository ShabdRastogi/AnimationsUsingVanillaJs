<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmongUs-shooting-game</title>
  <link rel="icon" type="image/png" href="./image/logo.jpg">
  <style>
    body{
      margin:0;
      padding:0;
      background-color: #111;
    }

    #board{
      border:2px solid;
      background-image: url('./image/background.png');
      background-position: center;
      background-size: cover;
    }
    button{
      display: block;
      margin: 20px auto 20px;
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#fff;
      color:#111;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#ddd;
    }
    .game{
      position:relative;
      width:fit-content;
      margin:25px auto;
    }
    #hitPopup{
      position:absolute;
      color:#00ffff;
      font:bold 25px Arial;
      text-shadow:0 0 10px #00ffff;
      pointer-events:none;
      opacity:0;
    }

    #hitPopup.show{
      animation:popup .7s ease-out;
    }

    @keyframes popup{
      0%{
        opacity:0;
        transform:translate(-50%,0) scale(.5);
      }

      20%{
        opacity:1;
        transform:translate(-50%,-10px) scale(1.2);
      }

      100%{
        opacity:0;
        transform:translate(-50%,-50px) scale(.8);
      }
    }
  </style>
  <title>Amongus-Shooting</title>
</head>

<body>
  <button onclick="window.location.href='./index.html'">Back to Games</button>
  <div class="game">
    <canvas id="board"></canvas>
    <div id="hitPopup">+1</div>
  </div>

  <script>

    let board;
    let boardHeight = 400;
    let boardWidth = 600;
    let context;

    //Character
    let charWidth = 50;
    let charHeight = 50;
    let charX = boardWidth/8;
    let charY = boardHeight/2;
    let charImg;
    let velocityY = 8;

    //Character object
    let character = {
      x:charX,
      y:charY,
      width:charWidth,
      height:charHeight
    };

    //Enemy
    let enemy = [];
    let enemyWidth = 45;
    let enemyHeight = 45;
    let enemyImg = new Image();

    //Bullet
    let bullets = [];
    let bulletWidth = 10;
    let bulletHeight = 5;
    let bulletSpeed = 7;
    let bulletCooldown = 300;
    let lastShot = 0;

    //Game
    let score = 0;
    let gameTime = 30;
    let timeLeft = gameTime;
    let gameOver = false;
    let timer;


    window.onload = function(){
      board = document.getElementById("board");
      board.width = boardWidth;
      board.height = boardHeight;
      context = board.getContext("2d");

      charImg = new Image();
      charImg.src = "./image/character.png";

      enemyImg.src = "./image/imposter.png";
      createEnemies();

      timer = setInterval(updateTimer,1000);

      requestAnimationFrame(update);

      //key trackers
      document.addEventListener("keydown",moveChar);
      document.addEventListener("keydown",shoot);
      document.addEventListener("keydown",restartGame);
    };


    function update(){
      requestAnimationFrame(update);

      context.clearRect(0,0,boardWidth,boardHeight);

      if(gameOver){
        drawGameOver();
        return;
      }

      drawCharacter();
      drawEnemies();
      drawBullets();
      updateBullets();
      collision();
      drawUI();
    }

    //character image
    function drawCharacter(){
      context.drawImage(charImg,character.x,character.y,character.width,character.height);
    }



    function createEnemies(){
      enemy = [];
      for(let i=0;i<3;i++){
        enemy.push({
          x:randomX(),
          y:randomY(),
          width:enemyWidth,
          height:enemyHeight
        });
      }
    }

    function randomX(){
      return Math.floor(
        boardWidth/4 +
        Math.random() *
        (boardWidth*3/4 - enemyWidth)
      );
    }
    function randomY(){
      return Math.floor(
        Math.random() *
        (boardHeight - enemyHeight)
      );
    }


    function drawEnemies(){
      for(let i=0;i<enemy.length;i++){
        context.drawImage(
          enemyImg,
          enemy[i].x,
          enemy[i].y,
          enemy[i].width,
          enemy[i].height
        );
      }
    }


    function shoot(e){
      if(gameOver){
        return;
      }
      if(e.code == "Space"){
        let currentTime = Date.now();
        if(currentTime - lastShot >= bulletCooldown){
          bullets.push({
            x:character.x + character.width,
            y:character.y +
              character.height/2 -
              bulletHeight/2,
            width:bulletWidth,
            height:bulletHeight
          });
          lastShot = currentTime;
        }
      }
    }

    function drawBullets(){
      context.fillStyle = "yellow";
      for(let i=0;i<bullets.length;i++){
        context.fillRect(
          bullets[i].x,
          bullets[i].y,
          bullets[i].width,
          bullets[i].height
        );
      }
    }
    function updateBullets(){
      for(let i=0;i<bullets.length;i++){
        bullets[i].x += bulletSpeed;
        if(bullets[i].x > boardWidth){
          bullets.splice(i,1);
          i--;
        }
      }
    }
    function collision(){
      for(let i=0;i<bullets.length;i++){
        for(let j=0;j<enemy.length;j++){
          let bullet = bullets[i];
          let target = enemy[j];
          if(bullet.x < target.x + target.width &&
            bullet.x + bullet.width >target.x &&
            bullet.y <target.y + target.height &&
            bullet.y + bullet.height > target.y
          ){

            bullets.splice(i,1);
            score++;
            showHitPopup(target.x + target.width/2,target.y);
            target.x = randomX();
            target.y = randomY();
            i--;
            break;
          }
        }
      }
    }

    function moveChar(e){
      if(gameOver){
        return;
      }
      if((e.code === "ArrowUp" || e.code === "KeyW") && character.y > 0){
        character.y -= velocityY;
      }
      if((e.code === "ArrowDown" || e.code === "KeyS") && character.y + character.height < boardHeight){
        character.y += velocityY;
      }
    }

    function updateTimer(){
      if(timeLeft > 0){
        timeLeft--;
      }
      else{
        gameOver = true;
        clearInterval(timer);
      }
    }
    function drawUI(){
      context.fillStyle = "white";
      context.font = "20px Arial";
      context.fillText("Score: " + score,20,30);
      context.fillText("Time: " + timeLeft,500,30);
    }

    function drawGameOver(){
      context.fillStyle = "white";
      context.textAlign = "center";
      context.font = "40px Arial";
      context.fillText("GAME OVER",boardWidth/2,150);

      context.font = "25px Arial";
      context.fillText("Score: " + score,boardWidth/2,200);

      context.font = "18px Arial";
      context.fillText("Press R to restart",boardWidth/2,250);

      context.textAlign = "left";
    }


    function restartGame(e){
      if(e.code === "KeyR" && gameOver){
        score = 0;
        timeLeft = gameTime;
        gameOver = false;
        bullets = [];
        character.x = charX;
        character.y = charY

        createEnemies();
        clearInterval(timer);

        timer = setInterval(updateTimer,1000);
      }
    }
    function showHitPopup(x,y){
      let popup = document.getElementById("hitPopup");

      popup.style.left = x + "px";
      popup.style.top = y + "px";

      popup.classList.remove("show");
      void popup.offsetWidth;
      popup.classList.add("show");
    }

  </script>

</body>
</html>
